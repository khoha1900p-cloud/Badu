name: Avica

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Essentials
        shell: powershell
        run: |
          $url = "https://gitlab.com/raposabrty/pcrdp/-/raw/main/Downloads.bat"
          Invoke-WebRequest -Uri $url -OutFile "$env:GITHUB_WORKSPACE\Downloads.bat" -UseBasicParsing
          
          if (!(Test-Path "$env:GITHUB_WORKSPACE\Downloads.bat")) {
            Write-Error "Downloads.bat was not downloaded."
            exit 1
          }

          cmd /c "$env:GITHUB_WORKSPACE\Downloads.bat"

      - name: Show Website
        shell: cmd
        run: |
          if exist show.bat (
            call show.bat
          ) else (
            echo show.bat not found
          )

      - name: Time Counter
        shell: cmd
        run: |
          if exist loop.bat (
            call loop.bat
          ) else (
            echo loop.bat not found
          )
